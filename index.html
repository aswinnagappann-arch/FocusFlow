<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow — Learn. Organise. Remember.</title>
    <meta
      name="description"
      content="FocusFlow is a personal productivity and learning tracker that helps you manage daily tasks, track study topics, and retain knowledge with automated 1-4-7 follow-up reminders."
    />
    <meta property="og:title" content="FocusFlow — Learn. Organise. Remember." />
    <meta
      property="og:description"
      content="Manage daily tasks, track learning topics, and remember what you learn with automated 1-4-7 follow-up reminders."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0D11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusFlow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('focusflow_settings_v1');
          var theme = 'dark';
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark')) {
              theme = parsed.theme;
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#F7F8FA] text-[#111827] dark:bg-[#0B0D11] dark:text-[#F3F4F6] antialiased selection:bg-violet-500/20 selection:text-violet-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
